name: 'Release FlowGit'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Cần toàn bộ lịch sử để tạo release notes

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust targets
        if: startsWith(matrix.platform, 'macos')
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Pre-download WiX Toolset for Windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $wixDir = "$env:LOCALAPPDATA\tauri\WixTools"
          New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
          Write-Host "Pre-downloading WiX Toolset to $wixDir with retries..."
          curl.exe -fSL --retry 5 --retry-delay 3 --retry-all-errors "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -o "$env:TEMP\wix314-binaries.zip"
          tar.exe -xf "$env:TEMP\wix314-binaries.zip" -C $wixDir
          Remove-Item "$env:TEMP\wix314-binaries.zip" -Force
          Write-Host "WiX Toolset verified:"
          Get-ChildItem -Path $wixDir -Filter "candle.exe"

      - name: Install Node dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Generate Release Notes
        id: release_notes
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "Không có tag trước – lấy 20 commit gần nhất."
            NOTES=$(git log --pretty=format:"- %s (%h)" -20)
          else
            echo "Tag trước: $PREV_TAG"
            NOTES=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi
          # Escape ký tự đặc biệt cho GitHub Output
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: 'FlowGit v__VERSION__'
          releaseBody: ${{ steps.release_notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package MSIX for Microsoft Store
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          MSIX_PACKAGE_NAME: ${{ secrets.MSIX_PACKAGE_NAME || vars.MSIX_PACKAGE_NAME }}
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER || vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME || vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $msi = Get-ChildItem -Path "src-tauri\target\release\bundle\msi" -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Write-Host "Packaging MSIX from MSI: $($msi.FullName)"
            powershell -ExecutionPolicy Bypass -File scripts/create-msix.ps1 -MsiPath $msi.FullName
          } else {
            Write-Warning "MSI file not found in src-tauri\target\release\bundle\msi!"
          }

      - name: Upload MSIX to GitHub Release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-msix/*.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

